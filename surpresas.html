<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sua Surpresa ❤️</title>
    <link rel="stylesheet" href="index.css">
    <script src="index.js" defer></script>
</head>
<body>

    <div class="controle-musica" onclick="alternarMusica()">
        <span id="iconeMusica">🎵</span>
    </div>

    <div class="botoes-topo">
        <button class="btn-navegar" onclick="navegarPara('index.html')">⬅Voltar ao Início</button>
    </div>

    <section class="historia">
        <article class="card">
            <img src="27992.jpeg" alt="Nossos Momentos" />
            <div class="informacoes">
                <h2>Uma história só nossa..</h2>
                <button class="btn-estilizado" onclick="revelarMensagem(1)">Revelar Surpresa</button>
            </div>
        </article>
        <article class="card">
            <img src="27991.jpeg" alt="Nosso apoio" />
            <div class="informacoes">
                <h2>Nosso companherismo</h2>
                <button class="btn-estilizado" onclick="revelarMensagem(2)">Revelar Surpresa</button>
            </div>
        </article>

        <article class="card">
            <img src="27993.jpeg" alt="Coisas favoritas" />
            <div class="informacoes">
                <h2>Cada um com suas coisas favoritas...</h2>
                <button class="btn-estilizado" onclick="revelarMensagem(3)">Revelar Surpresa</button>
            </div>
        </article>
    </section>

    <div class="navegacao-central">
        <button class="btn-navegar" onclick="navegarPara('galeria.html')">Ir para Nossa Galeria</button>
    </div>

    <div id="janelaSurpresa" class="modal" style="display: none;">
        <div class="modal-conteudo">
            <span class="botao-fechar" onclick="fecharSurpresa()">&times;</span>
            <img id="imagemSurpresa" src="" alt="Imagem da Surpresa" />
            <p id="textoSurpresa"></p>
        </div>
    </div>

    <audio id="musicaParabens" src="https://soundhelix.com" preload="auto" loop></audio>
</body>
</html>
